<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ofertas de la Semana - JILO SERVICE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <style>
    body { 
      font-family: 'Segoe UI', system-ui, sans-serif; 
    }

    .hero-ofertas { 
      background: linear-gradient(rgba(135, 206, 250, 0.75), rgba(70, 130, 180, 0.85)), 
                  url('https://images.unsplash.com/photo-1581091226825-a6a0358330e6?ixlib=rb-4.0.3&auto=format&fit=crop&q=80'); 
      background-size: cover; 
      background-position: center;
      min-height: 60vh;
    }

    .offer-card {
      transition: all 0.4s ease;
    }
    .offer-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }

    .stock-bar {
      height: 8px;
      background: linear-gradient(90deg, #22c55e, #eab308);
      border-radius: 9999px;
      transition: width 1.5s ease;
    }
    .stock-low {
      background: linear-gradient(90deg, #ef4444, #f59e0b);
    }
  </style>
</head>
<body class="bg-gray-50">

  <!-- Navbar -->
  <nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <img src="images/logojilo.jpeg" alt="Jilo Service" class="h-10 w-auto">
      </a>
      <a href="index.html" class="text-blue-700 hover:text-blue-900 font-medium flex items-center gap-2">
        ← Volver al Inicio
      </a>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero-ofertas text-white text-center flex items-center">
    <div class="max-w-5xl mx-auto px-6">
      <h1 class="text-5xl md:text-6xl font-black tracking-wider mb-4">OFERTAS DE LA SEMANA</h1>
      <p class="text-2xl font-medium">¡Precios especiales solo esta semana!</p>
      <p class="mt-4 text-lg">-----------------------------------</p>
    </div>
  </section>

  <!-- Ofertas -->
  <section class="py-16">
    <div class="max-w-6xl mx-auto px-6">
      <div id="ofertas-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
        <!-- Se generan con JavaScript -->
      </div>
    </div>
  </section>

  <footer class="bg-gray-950 text-gray-500 py-10 text-center">
    <p>Copyright © 2026 Jilo Service - Todos los derechos reservados. Aguascalientes</p>
  </footer>

  <script>
    async function cargarOfertas() {
      const container = document.getElementById('ofertas-container');

      try {
        const response = await fetch('/data/ofertas.json');
        
        if (!response.ok) throw new Error('No se encontró el archivo');

        const data = await response.json();
        container.innerHTML = '';

        data.ofertas.forEach(oferta => {
          const stockPorcentaje = Math.min(Math.round((oferta.stock / 40) * 100), 100);

          const cardHTML = `
            <div class="offer-card bg-white rounded-3xl overflow-hidden shadow-xl">
              <div class="bg-orange-500 text-white text-center py-2 font-bold text-lg">¡${oferta.descuento}% OFF!</div>
              <img src="${oferta.imagen}" alt="${oferta.titulo}" class="w-full h-56 object-cover">
              <div class="p-6">
                <h3 class="font-bold text-xl">${oferta.titulo}</h3>
                <p class="text-gray-600 mt-1">${oferta.marca}</p>
                
                <div class="flex items-center gap-3 mt-4">
                  <span class="text-3xl font-bold text-green-600">$${oferta.precio_oferta}</span>
                  <span class="line-through text-gray-400">$${oferta.precio_original}</span>
                </div>

                <div class="mt-6">
                  <div class="flex justify-between text-sm mb-2">
                    <span class="font-medium text-gray-700">Stock disponible</span>
                    <span class="font-bold ${oferta.stock <= 10 ? 'text-red-600' : 'text-orange-600'}">
                      ${oferta.stock} unidades
                    </span>
                  </div>
                  <div class="bg-gray-200 rounded-full h-2.5">
                    <div class="stock-bar ${oferta.stock <= 10 ? 'stock-low' : ''}" 
                         style="width: ${stockPorcentaje}%"></div>
                  </div>
                </div>

                <a href="https://wa.me/5214494382751?text=${encodeURIComponent(oferta.whatsapp_texto)}" 
                   target="_blank"
                   class="block mt-6 text-center bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl font-semibold">
                  Comprar por WhatsApp
                </a>
              </div>
            </div>
          `;

          container.innerHTML += cardHTML;
        });

      } catch (error) {
        console.error(error);
        container.innerHTML = `
          <div class="col-span-3 text-center py-20">
            <p class="text-red-500 text-lg">No se pudieron cargar las ofertas</p>
            <p class="text-gray-500 mt-3">Verifica que el archivo <strong>/data/ofertas.json</strong> esté subido correctamente a Netlify.</p>
          </div>`;
      }
    }

    // Cargar al abrir la página
    window.addEventListener('load', cargarOfertas);
  </script>
</body>
</html>
